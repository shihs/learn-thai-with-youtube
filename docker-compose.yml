# 啟動：docker compose up --build
# 前端 http://localhost:5173 ，後端 http://localhost:8000
# 埠被佔用時可以改：API_PORT=8001 WEB_PORT=5174 docker compose up --build
services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    # API 金鑰在執行時從 .env 注入，不會進到映像檔
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./frontend
      args:
        # 瀏覽器連後端用的網址，要和上面 api 對外的埠一致
        VITE_API_URL: "http://127.0.0.1:${API_PORT:-8000}"
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
